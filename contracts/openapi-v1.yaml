openapi: 3.0.3
info:
  title: StayVista API v1
  version: 1.0.0
servers:
- url: http://localhost:8080
paths:
  /v1/search/properties:
    get:
      summary: Search properties
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: city
        in: query
        schema:
          type: string
      - name: check_in
        in: query
        schema:
          type: string
          format: date
      - name: check_out
        in: query
        schema:
          type: string
          format: date
      - name: adults
        in: query
        schema:
          type: integer
          minimum: 0
      - name: children
        in: query
        schema:
          type: integer
          minimum: 0
      - name: min_price
        in: query
        schema:
          type: integer
          minimum: 0
      - name: max_price
        in: query
        schema:
          type: integer
          minimum: 0
      - name: sort
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSearch'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/bookings/holds:
    post:
      summary: Create booking hold
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingHoldRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBookingHold'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited / Queue required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/bookings/{bookingId}/confirm:
    post:
      summary: Confirm booking
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingConfirmRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBookingConfirm'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/bookings/{bookingId}/cancel:
    post:
      summary: Cancel booking
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCancelRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBookingCancel'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/queue/join:
    post:
      summary: Join waiting room
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueJoinRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeQueueJoin'
  /v1/queue/status:
    get:
      summary: Get waiting room status
      parameters:
      - name: ticket
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeQueueStatus'
  /v1/geo/pois/nearby:
    get:
      summary: Nearby POIs
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: lng
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: radius_m
        in: query
        schema:
          type: integer
          default: 2000
      - name: category
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 50
          default: 20
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNearbyPois'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/chat/recommend:
    post:
      summary: Chat recommendations
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRecommendRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeChatRecommend'
  /v1/chat/recommend:stream:
    post:
      summary: Chat recommendations streaming (SSE)
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRecommendRequest'
      responses:
        '200':
          description: OK (server-sent events)
          content:
            text/event-stream:
              schema:
                type: string
  /v1/chat/preferences/feedback:
    post:
      summary: Update chat preference profile from explicit feedback
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPreferenceFeedbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePreferenceProfile'
  /v1/admin/chat/rag/reindex:
    post:
      summary: Rebuild chat RAG index
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum: [full, incremental]
          default: incremental
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /v1/admin/chat/prompts:
    get:
      summary: List chat prompt templates
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: prompt_key
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePromptTemplateList'
    post:
      summary: Upsert chat prompt template
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePromptTemplate'
  /v1/admin/chat/prompts/rollback:
    post:
      summary: Rollback active prompt template
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateRollbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePromptTemplate'
  /v1/admin/chat/experiments/chat-core:
    get:
      summary: Get chat-core experiment config
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeChatExperiment'
    post:
      summary: Update chat-core experiment config
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatExperimentUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeChatExperiment'
components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    XUserId:
      name: X-User-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    EnvelopeBase:
      type: object
      properties:
        request_id:
          type: string
      required:
      - request_id
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    ErrorEnvelope:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          error:
            $ref: '#/components/schemas/ErrorBody'
        required:
        - error
    Money:
      type: object
      properties:
        currency:
          type: string
        amount_total:
          type: integer
      required:
      - currency
      - amount_total
    BookingHoldRequest:
      type: object
      properties:
        room_type_id:
          type: integer
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        rooms:
          type: integer
          minimum: 1
        guests:
          type: object
          properties:
            adults:
              type: integer
            children:
              type: integer
          required:
          - adults
          - children
        price:
          $ref: '#/components/schemas/Money'
        user_note:
          type: string
      required:
      - room_type_id
      - check_in
      - check_out
      - rooms
      - guests
      - price
    BookingHoldData:
      type: object
      properties:
        booking_id:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - booking_id
      - status
      - expires_at
    EnvelopeBookingHold:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/BookingHoldData'
        required:
        - data
    BookingConfirmRequest:
      type: object
      properties:
        payment_method:
          type: string
        payment_token:
          type: string
        agree_terms:
          type: boolean
      required:
      - payment_method
      - payment_token
    BookingConfirmData:
      type: object
      properties:
        booking_id:
          type: string
        status:
          type: string
        confirmed_at:
          type: string
          format: date-time
      required:
      - booking_id
      - status
      - confirmed_at
    EnvelopeBookingConfirm:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/BookingConfirmData'
        required:
        - data
    BookingCancelRequest:
      type: object
      properties:
        reason:
          type: string
    BookingCancelData:
      type: object
      properties:
        booking_id:
          type: string
        status:
          type: string
        cancelled_at:
          type: string
          format: date-time
      required:
      - booking_id
      - status
      - cancelled_at
    EnvelopeBookingCancel:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/BookingCancelData'
        required:
        - data
    SearchItem:
      type: object
      properties:
        property_id:
          type: integer
        name:
          type: string
        city:
          type: string
        price_min:
          type: integer
        rating:
          type: number
        thumbnail_url:
          type: string
      required:
      - property_id
      - name
    SearchData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
        next_cursor:
          type: string
      required:
      - items
    EnvelopeSearch:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SearchData'
        required:
        - data
    QueueJoinRequest:
      type: object
      properties:
        queue_key:
          type: string
      required:
      - queue_key
    QueueJoinData:
      type: object
      properties:
        queue_key:
          type: string
        ticket:
          type: string
        position:
          type: integer
        estimated_wait_seconds:
          type: integer
      required:
      - queue_key
      - ticket
      - position
    EnvelopeQueueJoin:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/QueueJoinData'
        required:
        - data
    QueueStatusData:
      type: object
      properties:
        state:
          type: string
        position:
          type: integer
        estimated_wait_seconds:
          type: integer
        admit_token:
          type: string
      required:
      - state
    EnvelopeQueueStatus:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/QueueStatusData'
        required:
        - data
    PoiItem:
      type: object
      properties:
        poi_id:
          type: string
        name:
          type: string
        category:
          type: string
        distance_m:
          type: integer
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
          required:
          - lat
          - lng
      required:
      - poi_id
      - name
      - location
    NearbyPoisData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PoiItem'
      required:
      - items
    EnvelopeNearbyPois:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/NearbyPoisData'
        required:
        - data
    ChatRecommendRequest:
      type: object
      properties:
        message:
          type: string
        context:
          type: object
          additionalProperties: true
      required:
      - message
    ChatCard:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        title:
          type: string
        price:
          type: string
          nullable: true
        why:
          type: string
          nullable: true
        source:
          type: array
          items:
            $ref: '#/components/schemas/ChatSource'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ChatSource'
        poi_id:
          type: string
          nullable: true
        property_id:
          type: integer
          format: int64
          nullable: true
        product_id:
          type: integer
          format: int64
          nullable: true
        package_id:
          type: integer
          format: int64
          nullable: true
      required:
      - type
      - title
    ChatSource:
      type: object
      properties:
        doc_id:
          type: string
        title:
          type: string
        url:
          type: string
          nullable: true
        snippet:
          type: string
        source_type:
          type: string
      required:
      - doc_id
      - title
      - snippet
      - source_type
    ItineraryItem:
      type: object
      properties:
        day:
          type: integer
        time_slot:
          type: string
        title:
          type: string
        item_type:
          type: string
        reason:
          type: string
        source:
          $ref: '#/components/schemas/ChatSource'
      required:
      - day
      - time_slot
      - title
      - item_type
      - reason
      - source
    ChatDebug:
      type: object
      properties:
        route:
          type: string
        model:
          type: string
          nullable: true
        llm_ms:
          type: integer
          format: int64
        rag_ms:
          type: integer
          format: int64
        total_ms:
          type: integer
          format: int64
      required:
      - route
      - llm_ms
      - rag_ms
      - total_ms
    ChatRecommendData:
      type: object
      properties:
        answer:
          type: string
        assistant_text:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/ChatCard'
        itinerary:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryItem'
        followups:
          type: array
          items:
            type: string
        context_used:
          type: object
          additionalProperties: true
        llm_used:
          type: boolean
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ChatSource'
        debug:
          $ref: '#/components/schemas/ChatDebug'
      required:
      - answer
      - assistant_text
      - cards
      - followups
      - context_used
      - llm_used
    ChatPreferenceFeedbackRequest:
      type: object
      properties:
        user_id:
          type: string
        session_id:
          type: string
        conversation_id:
          type: string
        like_tags:
          type: array
          items:
            type: string
        dislike_tags:
          type: array
          items:
            type: string
        like_categories:
          type: array
          items:
            type: string
        dislike_categories:
          type: array
          items:
            type: string
    PreferenceProfileSnapshot:
      type: object
      properties:
        tagWeights:
          type: object
          additionalProperties:
            type: integer
        categoryWeights:
          type: object
          additionalProperties:
            type: integer
      required:
      - tagWeights
      - categoryWeights
    PromptTemplateRecord:
      type: object
      properties:
        prompt_key:
          type: string
        version:
          type: string
        system_prompt:
          type: string
          nullable: true
        user_prompt_template:
          type: string
          nullable: true
        is_active:
          type: boolean
        updated_at:
          type: string
      required:
      - prompt_key
      - version
      - is_active
      - updated_at
    PromptTemplateUpsertRequest:
      type: object
      properties:
        prompt_key:
          type: string
          default: chat-core
        version:
          type: string
        system_prompt:
          type: string
          nullable: true
        user_prompt_template:
          type: string
          nullable: true
        activate:
          type: boolean
      required:
      - version
    PromptTemplateRollbackRequest:
      type: object
      properties:
        prompt_key:
          type: string
          default: chat-core
        version:
          type: string
      required:
      - version
    PromptTemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PromptTemplateRecord'
      required:
      - items
    ChatExperimentConfig:
      type: object
      properties:
        experiment_key:
          type: string
        enabled:
          type: boolean
        rollout_percent:
          type: integer
          minimum: 0
          maximum: 100
        treatment_model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        parameters_json:
          type: object
          additionalProperties: true
        updated_at:
          type: string
      required:
      - experiment_key
      - enabled
      - rollout_percent
      - parameters_json
      - updated_at
    ChatExperimentUpdateRequest:
      type: object
      properties:
        enabled:
          type: boolean
        rollout_percent:
          type: integer
          minimum: 0
          maximum: 100
        treatment_model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        parameters_json:
          type: object
          additionalProperties: true
    EnvelopeChatRecommend:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ChatRecommendData'
        required:
        - data
    EnvelopePreferenceProfile:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/PreferenceProfileSnapshot'
        required:
        - data
    EnvelopePromptTemplate:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/PromptTemplateRecord'
        required:
        - data
    EnvelopePromptTemplateList:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/PromptTemplateList'
        required:
        - data
    EnvelopeChatExperiment:
      allOf:
      - $ref: '#/components/schemas/EnvelopeBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ChatExperimentConfig'
        required:
        - data
