groups:
  - name: stayvista-chat-slo
    interval: 30s
    rules:
      - alert: ChatErrorBurnRateFast
        expr: |
          (
            sum(rate(chat_llm_fail_total[5m])) / clamp_min(sum(rate(chat_requests_total[5m])), 1)
          ) > 0.02
          and
          (
            sum(rate(chat_llm_fail_total[1h])) / clamp_min(sum(rate(chat_requests_total[1h])), 1)
          ) > 0.01
        for: 5m
        labels:
          severity: page
          service: chat
        annotations:
          summary: "Chat error burn-rate fast"
          description: "5m/1h burn-rate exceeded. Investigate queue rejects, timeouts, and fallback spikes."

      - alert: ChatErrorBurnRateSlow
        expr: |
          (
            sum(rate(chat_llm_fail_total[30m])) / clamp_min(sum(rate(chat_requests_total[30m])), 1)
          ) > 0.01
          and
          (
            sum(rate(chat_llm_fail_total[6h])) / clamp_min(sum(rate(chat_requests_total[6h])), 1)
          ) > 0.005
        for: 15m
        labels:
          severity: ticket
          service: chat
        annotations:
          summary: "Chat error burn-rate slow"
          description: "30m/6h burn-rate exceeded. Check degraded quality and ongoing fallback ratio."

      - alert: ChatLlmRejectRateHigh
        expr: |
          sum(rate(llm_reject_rate_total[5m])) > 1
        for: 10m
        labels:
          severity: page
          service: chat
        annotations:
          summary: "LLM queue reject sustained"
          description: "LLM queue rejects are sustained over 10m. Tune budget/concurrency or reduce LLM usage."

      - alert: ChatLatencyP95High
        expr: |
          max_over_time(chat_latency_seconds_max[5m]) > 1.2
        for: 10m
        labels:
          severity: ticket
          service: chat
        annotations:
          summary: "Chat latency p95 above SLO"
          description: "chat_latency_seconds p95 exceeded 1.2s for 10m."

      - alert: CopilotOrchestratorLatencyP95High
        expr: |
          histogram_quantile(0.95, sum(rate(chat_copilot_orchestrator_latency_ms_seconds_bucket[5m])) by (le)) > 0.8
        for: 10m
        labels:
          severity: ticket
          service: chat
          component: copilot
        annotations:
          summary: "Copilot orchestrator p95 latency above SLO"
          description: "chat_copilot_orchestrator p95 latency exceeded 800ms for 10m."

      - alert: CopilotOrchestratorLatencyP99High
        expr: |
          histogram_quantile(0.99, sum(rate(chat_copilot_orchestrator_latency_ms_seconds_bucket[5m])) by (le)) > 1.2
        for: 10m
        labels:
          severity: page
          service: chat
          component: copilot
        annotations:
          summary: "Copilot orchestrator p99 latency above SLO"
          description: "chat_copilot_orchestrator p99 latency exceeded 1.2s for 10m."

      - alert: CopilotWidgetErrorRateHigh
        expr: |
          (
            sum(rate(ai_widget_event_total{event=~"ai_widget_orchestrator_fallback|ai_widget_search_blocked"}[10m]))
            /
            clamp_min(sum(rate(ai_widget_event_total{event="ai_widget_prompt_submit"}[10m])), 1)
          ) > 0.20
        for: 10m
        labels:
          severity: ticket
          service: chat
          component: copilot
        annotations:
          summary: "Copilot widget error/fallback ratio high"
          description: "Fallback+blocked ratio exceeded 20% of prompt_submit for 10m."

      - alert: CopilotActionApplySuccessRateLow
        expr: |
          (
            sum(rate(ai_copilot_action_apply_total{result="success"}[10m]))
            /
            clamp_min(sum(rate(ai_copilot_action_apply_total[10m])), 1)
          ) < 0.85
        for: 15m
        labels:
          severity: ticket
          service: chat
          component: copilot
        annotations:
          summary: "Copilot action apply success rate low"
          description: "Action apply success rate stayed below 85% for 15m."

      - alert: ChatSearchHandoffEmptyRatioHigh
        expr: |
          (
            sum(rate(chat_search_handoff_total{result="empty"}[15m]))
            /
            clamp_min(sum(rate(chat_search_handoff_total[15m])), 1)
          ) > 0.35
        for: 15m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff empty ratio high"
          description: "chat_search_handoff_total empty ratio exceeded 35% for 15m."

      - alert: ChatSearchHandoffConfidenceLow
        expr: |
          (
            sum(rate(chat_search_handoff_confidence_sum[15m]))
            /
            clamp_min(sum(rate(chat_search_handoff_confidence_count[15m])), 1)
          ) < 0.45
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff confidence dropped"
          description: "Average handoff confidence stayed below 0.45 for 20m."

      - alert: ChatSearchHandoffProfileAppliedRatioLow
        expr: |
          (
            sum(rate(ai_widget_handoff_profile_applied_total{applied="true"}[30m]))
            /
            clamp_min(sum(rate(ai_widget_handoff_profile_applied_total[30m])), 1)
          ) < 0.20
          and
          (
            sum(rate(ai_widget_event_total{event="ai_widget_search_handoff"}[30m])) > 0.05
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff profile-applied ratio low"
          description: "Profile-applied ratio stayed below 20% for 30m while handoff traffic is present."

      - alert: ChatSearchHandoffClarifySuggestedRatioHigh
        expr: |
          (
            sum(rate(chat_search_handoff_clarify_suggested_total[15m]))
            /
            clamp_min(sum(rate(chat_search_handoff_total[15m])), 1)
          ) > 0.65
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff clarify suggested ratio high"
          description: "Clarify-suggested ratio exceeded 65% for 20m. Check slot resolver/prompt tuning."

      - alert: ChatSearchHandoffClarifyCtrLow
        expr: |
          (
            sum(rate(ai_widget_clarify_click_total[30m]))
            /
            clamp_min(sum(rate(chat_search_handoff_clarify_suggested_total[30m])), 1)
          ) < 0.25
          and
          (
            sum(rate(chat_search_handoff_clarify_suggested_total[30m])) > 0.02
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff clarify CTR low"
          description: "Clarify click-through stayed below 25% for 30m while clarify suggestions are active."

      - alert: ChatSearchHandoffScopeDriftHigh
        expr: |
          max(
            abs(
              sum(rate(ai_widget_handoff_scope_total[15m])) by (scope)
              -
              sum(rate(ai_widget_source_scope_total{event="ai_widget_search_handoff"}[15m])) by (scope)
            )
            /
            clamp_min(
              sum(rate(ai_widget_source_scope_total{event="ai_widget_search_handoff"}[15m])) by (scope),
              0.0001
            )
          ) > 0.20
          and
          (
            sum(rate(ai_widget_source_scope_total{event="ai_widget_search_handoff"}[15m])) > 0.05
          )
        for: 15m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff source scope drift high"
          description: "Scope drift ratio exceeded 20% for 15m. Check source-scope parse/fallback/UI sync."

      - alert: ChatSearchHandoffClarifyRequiredRatioHigh
        expr: |
          (
            sum(rate(chat_search_handoff_clarify_required_total{required="true"}[15m]))
            /
            clamp_min(sum(rate(chat_search_handoff_clarify_required_total[15m])), 1)
          ) > 0.60
          and
          (
            sum(rate(chat_search_handoff_total[15m])) > 0.05
          )
        for: 15m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff clarify-required ratio high"
          description: "clarify_required=true ratio exceeded 60% for 15m. Check slot extraction/prompt drift."

      - alert: ChatSearchHandoffMissingSlotCountHigh
        expr: |
          (
            sum(rate(chat_search_handoff_missing_slot_count_sum[15m]))
            /
            clamp_min(sum(rate(chat_search_handoff_missing_slot_count_count[15m])), 1)
          ) > 1.8
          and
          (
            sum(rate(chat_search_handoff_total[15m])) > 0.05
          )
        for: 15m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff missing-slot count high"
          description: "Average missing_slot_count stayed above 1.8 for 15m."

      - alert: ChatSearchHandoffClarifyActionClickLow
        expr: |
          (
            sum(rate(ai_widget_clarify_action_click_total[20m]))
            /
            clamp_min(sum(rate(chat_search_handoff_clarify_required_total{required="true"}[20m])), 1)
          ) < 0.35
          and
          (
            sum(rate(chat_search_handoff_clarify_required_total{required="true"}[20m])) > 0.03
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff clarify-action click low"
          description: "Clarify action click ratio stayed below 35% against clarify_required traffic for 20m."

      - alert: ChatSearchHandoffClarifyActionSlotSkewHigh
        expr: |
          (
            max(sum(rate(chat_search_handoff_clarify_action_total[30m])) by (slot))
            /
            clamp_min(sum(rate(chat_search_handoff_clarify_action_total[30m])), 1)
          ) > 0.75
          and
          (
            sum(rate(chat_search_handoff_clarify_action_total[30m])) > 0.05
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "Search handoff clarify-action slot skew high"
          description: "One clarify_action slot occupied over 75% for 30m. Check slot detector bias."

      - alert: ChatSourceScopeIntentMismatchHigh
        expr: |
          max(
            abs(
              sum(rate(ai_widget_source_scope_total{event="ai_widget_prompt_submit"}[20m])) by (scope)
              -
              sum(rate(ai_widget_source_scope_total{event="ai_widget_search_handoff"}[20m])) by (scope)
            )
            /
            clamp_min(
              sum(rate(ai_widget_source_scope_total{event="ai_widget_prompt_submit"}[20m])) by (scope),
              0.0001
            )
          ) > 0.35
          and
          (
            sum(rate(ai_widget_source_scope_total{event="ai_widget_prompt_submit"}[20m])) > 0.05
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "AI source scope intent mismatch high"
          description: "Prompt-submit vs handoff scope mismatch exceeded 35% for 20m."

      - alert: ChatSortHintClickThroughLow
        expr: |
          (
            sum(rate(ai_widget_sort_hint_total[20m]))
            /
            clamp_min(sum(rate(chat_search_handoff_sort_hint_total[20m])), 1)
          ) < 0.30
          and
          (
            sum(rate(chat_search_handoff_sort_hint_total[20m])) > 0.03
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: handoff
        annotations:
          summary: "AI sort hint click-through low"
          description: "Sort hint click-through stayed below 30% for 20m."

      - alert: ChatWidgetSessionRestoreFailureRatioHigh
        expr: |
          (
            sum(rate(ai_widget_session_restore_total{result!="success"}[15m]))
            /
            clamp_min(sum(rate(ai_widget_session_restore_total[15m])), 1)
          ) > 0.40
          and
          (
            sum(rate(ai_widget_session_restore_total[15m])) > 0.05
          )
        for: 15m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget session restore failure ratio high"
          description: "Session restore failure ratio stayed above 40% for 15m."

      - alert: ChatWidgetFirstResponseLatencyHigh
        expr: |
          max_over_time(ai_widget_time_to_first_response_ms_max[10m]) > 3000
        for: 10m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget time-to-first-response high"
          description: "time_to_first_response max stayed above 3000ms for 10m."

      - alert: ChatWidgetNegativeFeedbackRatioHigh
        expr: |
          (
            sum(rate(ai_widget_answer_feedback_total{feedback="negative"}[20m]))
            /
            clamp_min(sum(rate(ai_widget_answer_feedback_total[20m])), 1)
          ) > 0.45
          and
          (
            sum(rate(ai_widget_answer_feedback_total[20m])) > 0.03
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: quality
        annotations:
          summary: "AI widget negative feedback ratio high"
          description: "Negative feedback ratio exceeded 45% for 20m."

      - alert: ChatWidgetRegenerateRatioHigh
        expr: |
          (
            sum(rate(ai_widget_regenerate_click_total[20m]))
            /
            clamp_min(sum(rate(ai_widget_prompt_submit_total[20m])), 1)
          ) > 0.60
          and
          (
            sum(rate(ai_widget_prompt_submit_total[20m])) > 0.05
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: quality
        annotations:
          summary: "AI widget regenerate ratio high"
          description: "Regenerate ratio stayed above 60% for 20m."

      - alert: ChatWidgetGenerationCancelRatioHigh
        expr: |
          (
            sum(rate(ai_widget_generation_cancel_total[20m]))
            /
            clamp_min(sum(rate(ai_widget_prompt_submit_total[20m])), 1)
          ) > 0.35
          and
          (
            sum(rate(ai_widget_prompt_submit_total[20m])) > 0.05
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget generation cancel ratio high"
          description: "Generation cancel ratio stayed above 35% for 20m."

      - alert: ChatWidgetBulkClearRatioHigh
        expr: |
          (
            sum(rate(ai_widget_filter_bulk_action_total{action="clear_all"}[20m]))
            /
            clamp_min(sum(rate(ai_widget_filter_bulk_apply_total[20m])), 1)
          ) > 0.70
          and
          (
            sum(rate(ai_widget_filter_bulk_apply_total[20m])) > 0.03
          )
        for: 20m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget bulk clear ratio high"
          description: "bulk clear_all ratio exceeded 70% for 20m, indicating weak filter quality."

      - alert: ChatWidgetAutopatchUsageLow
        expr: |
          (
            sum(rate(ai_widget_prompt_autopatch_total[30m]))
            /
            clamp_min(sum(rate(ai_widget_prompt_submit_total[30m])), 1)
          ) < 0.15
          and
          (
            sum(rate(ai_widget_prompt_submit_total[30m])) > 0.05
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget autopatch usage low"
          description: "Auto-patch usage ratio stayed below 15% for 30m while prompt traffic is present."

      - alert: ChatWidgetPromptReuseEngagementLow
        expr: |
          (
            sum(rate(ai_widget_prompt_reuse_click_total[30m]))
            /
            clamp_min(sum(rate(ai_widget_prompt_submit_total[30m])), 1)
          ) < 0.08
          and
          (
            sum(rate(ai_widget_prompt_submit_total[30m])) > 0.05
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget prompt history reuse engagement low"
          description: "Prompt history reuse ratio stayed below 8% for 30m while prompt traffic is present."

      - alert: ChatWidgetCardTypeFilterConversionLow
        expr: |
          (
            sum(rate(ai_widget_view_results_total[30m]))
            /
            clamp_min(sum(rate(ai_widget_card_type_filter_click_total[30m])), 1)
          ) < 0.30
          and
          (
            sum(rate(ai_widget_card_type_filter_click_total[30m])) > 0.03
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget card type filter conversion low"
          description: "view_results per card type filter click stayed below 0.30 for 30m."

      - alert: ChatWidgetCardListExpandedRatioLow
        expr: |
          (
            sum(rate(ai_widget_card_list_state_total{state="expanded"}[30m]))
            /
            clamp_min(sum(rate(ai_widget_card_list_state_total[30m])), 1)
          ) < 0.20
          and
          (
            sum(rate(ai_widget_card_list_toggle_click_total[30m])) > 0.02
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget card list expanded ratio low"
          description: "Card list expanded ratio stayed below 20% for 30m while toggle traffic is present."

      - alert: ChatWidgetCardSaveUnsavedRatioHigh
        expr: |
          (
            sum(rate(ai_widget_card_save_state_total{state="unsaved"}[30m]))
            /
            clamp_min(sum(rate(ai_widget_card_save_state_total[30m])), 1)
          ) > 0.60
          and
          (
            sum(rate(ai_widget_card_save_click_total[30m])) > 0.03
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget card unsave ratio high"
          description: "Card unsave ratio exceeded 60% for 30m, indicating low save quality."

      - alert: ChatWidgetSavedCardFollowupRatioLow
        expr: |
          (
            sum(rate(ai_widget_card_followup_origin_total{origin="saved_card"}[30m]))
            /
            clamp_min(sum(rate(ai_widget_card_followup_click_total[30m])), 1)
          ) < 0.15
          and
          (
            sum(rate(ai_widget_card_followup_click_total[30m])) > 0.02
          )
        for: 30m
        labels:
          severity: ticket
          service: chat
          component: widget
        annotations:
          summary: "AI widget saved-card follow-up ratio low"
          description: "saved_card origin follow-up ratio stayed below 15% for 30m."
