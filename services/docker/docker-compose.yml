name: stayvista-llm

services:
  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["llm"]
    ports:
      - "23434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.11.4
    profiles: ["llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -e
        echo "[ollama-init] pull chat model: $${OLLAMA_CHAT_MODEL}"
        ollama pull "$${OLLAMA_CHAT_MODEL}"
        echo "[ollama-init] pull embed model: $${OLLAMA_EMBED_MODEL}"
        ollama pull "$${OLLAMA_EMBED_MODEL}"
        echo "[ollama-init] complete"
    restart: "no"

volumes:
  ollama_data:
