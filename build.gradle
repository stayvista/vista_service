plugins {
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
}

group = 'com.devoceanblue'
version = '0.0.1-SNAPSHOT'
description = 'stayvista'

springBoot {
    mainClass = 'com.devoceanblue.stayvista.StayvistaApplicationKt'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        kotlin {
            srcDirs += ['services/eval/src/main/kotlin']
        }
    }
    test {
        kotlin {
            srcDirs += ['services/eval/src/test/kotlin']
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runEval', JavaExec) {
    group = 'verification'
    description = 'Run eval harness with custom args'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.devoceanblue.stayvista.eval.EvalRunner'
}

tasks.register('evalSmoke', JavaExec) {
    group = 'verification'
    description = 'Run smoke eval suite (>=30 cases)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.devoceanblue.stayvista.eval.EvalRunner'
    args '--mode=smoke',
        '--dataset=services/eval/datasets/smoke_seed.json',
        '--repeat=3',
        '--report-dir=services/eval/reports/smoke'
}

tasks.register('evalFull', JavaExec) {
    group = 'verification'
    description = 'Run full eval suite (>=500 cases)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.devoceanblue.stayvista.eval.EvalRunner'
    args '--mode=full',
        '--dataset=services/eval/datasets/full_seed.json',
        '--repeat=50',
        '--report-dir=services/eval/reports/full'
}
