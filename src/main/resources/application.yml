spring:
  application:
    name: stayvista
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/stayvista?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,filesystem:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    metrics:
      access: unrestricted

logging:
  pattern:
    level: "%5p [request_id:%X{request_id:-}]"

stayvista:
  booking:
    hold-ttl-minutes: 10
  queue:
    enabled: false
    max-admitted-per-key: 100
    ticket-ttl-seconds: 1800
    admit-token-ttl-seconds: 30
  rate-limit:
    enabled: true
    search-per-minute: 60
    booking-hold-per-minute: 10
    booking-confirm-per-minute: 5
