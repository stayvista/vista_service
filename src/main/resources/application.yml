server:
  port: ${SERVER_PORT:18765}

spring:
  application:
    name: stayvista
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:23306/stayvista?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:39092,127.0.0.1:39093,127.0.0.1:39094}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: filesystem:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    metrics:
      access: unrestricted

logging:
  pattern:
    level: "%5p [request_id:%X{request_id:-}]"

stayvista:
  auth:
    session-ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:7200}
    password:
      pbkdf2-iterations: ${PASSWORD_PBKDF2_ITERATIONS:180000}
      pbkdf2-key-length: ${PASSWORD_PBKDF2_KEY_LENGTH:256}
  booking:
    hold-ttl-minutes: 10
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5180,http://127.0.0.1:5180}
  search:
    use-opensearch: true
    opensearch-url: ${OPENSEARCH_URL:http://127.0.0.1:39200}
    index-name: properties_v1
    alias-name: properties
  autocomplete:
    cache-prefix: ${AC_CACHE_PREFIX:ac:stay:v1:}
    query-cache-ttl-seconds: ${AC_QUERY_CACHE_TTL_SECONDS:60}
    query-cache-jitter-seconds: ${AC_QUERY_CACHE_JITTER_SECONDS:20}
    popular-cache-ttl-seconds: ${AC_POPULAR_CACHE_TTL_SECONDS:600}
    recent-max-size: ${AC_RECENT_MAX_SIZE:20}
    recent-ttl-seconds: ${AC_RECENT_TTL_SECONDS:2592000}
    opensearch-url: ${AC_OPENSEARCH_URL:${OPENSEARCH_URL:http://127.0.0.1:39200}}
    index-name: ${AC_INDEX_NAME:ac_candidates_stay_v1}
    read-alias: ${AC_READ_ALIAS:ac_read}
    write-alias: ${AC_WRITE_ALIAS:ac_write}
    os-soft-timeout-ms: ${AC_OS_SOFT_TIMEOUT_MS:150}
    aggregate:
      enabled: ${AC_AGGREGATE_ENABLED:true}
      lookback-hours: ${AC_AGGREGATE_LOOKBACK_HOURS:168}
      scan-limit: ${AC_AGGREGATE_SCAN_LIMIT:20000}
      fixed-delay-ms: ${AC_AGGREGATE_FIXED_DELAY_MS:600000}
      initial-delay-ms: ${AC_AGGREGATE_INITIAL_DELAY_MS:45000}
  queue:
    enabled: false
    max-admitted-per-key: 100
    ticket-ttl-seconds: 1800
    admit-token-ttl-seconds: 30
  rate-limit:
    enabled: true
    search-per-minute: 60
    autocomplete-per-minute: 120
    booking-hold-per-minute: 10
    booking-confirm-per-minute: 5
    package-hold-per-minute: 10
    package-confirm-per-minute: 5
    chat-per-minute: 40
    telemetry-per-minute: 180
    bot-strict-per-minute: 8
    nearby:
      enabled: ${POI_NEARBY_RATE_LIMIT_ENABLED:true}
      refill-tokens: ${POI_NEARBY_RATE_REFILL_TOKENS:20}
      refill-window-ms: ${POI_NEARBY_RATE_REFILL_WINDOW_MS:10000}
      burst-tokens: ${POI_NEARBY_RATE_BURST_TOKENS:10}
  poi:
    nearby:
      cache-ttl-seconds: ${POI_NEARBY_CACHE_TTL_SECONDS:15}
      scan-limit: ${POI_NEARBY_SCAN_LIMIT:2000}
    geohash:
      max-prefixes: ${POI_GEOHASH_MAX_PREFIXES:24}
  chat:
    rag:
      candidate-limit: ${CHAT_RAG_CANDIDATE_LIMIT:320}
      rrf-k: ${CHAT_RAG_RRF_K:60}
      decay-window-days: ${CHAT_RAG_DECAY_WINDOW_DAYS:30}
      incremental-sync-enabled: ${CHAT_RAG_INCREMENTAL_SYNC_ENABLED:true}
      incremental-sync-ms: ${CHAT_RAG_INCREMENTAL_SYNC_MS:300000}
      incremental-sync-initial-delay-ms: ${CHAT_RAG_INCREMENTAL_SYNC_INITIAL_DELAY_MS:30000}
    cache:
      retrieval-ttl-seconds: ${CHAT_RETRIEVAL_CACHE_TTL_SECONDS:900}
      prompt-ttl-seconds: ${CHAT_PROMPT_CACHE_TTL_SECONDS:180}
    memory:
      ttl-seconds: ${CHAT_MEMORY_TTL_SECONDS:604800}
    preference:
      ttl-seconds: ${CHAT_PREFERENCE_TTL_SECONDS:2592000}
    semantic-cache:
      enabled: ${CHAT_SEMANTIC_CACHE_ENABLED:true}
      similarity-threshold: ${CHAT_SEMANTIC_CACHE_SIMILARITY_THRESHOLD:0.92}
      max-entries: ${CHAT_SEMANTIC_CACHE_MAX_ENTRIES:800}
    shadow:
      enabled: ${CHAT_SHADOW_ENABLED:false}
      model: ${CHAT_SHADOW_MODEL:}
    llm:
      enabled: ${CHAT_LLM_ENABLED:true}
      base-url: ${LLM_BASE_URL:${CHAT_LLM_BASE_URL:http://127.0.0.1:23434}}
      active-model: ${LLM_MODEL_CHAT:${CHAT_LLM_ACTIVE_MODEL:llama3.1:8b}}
      fallback-model: ${CHAT_LLM_FALLBACK_MODEL:}
      soft-timeout-ms: ${LLM_TIMEOUT_SOFT_MS:${CHAT_LLM_SOFT_TIMEOUT_MS:30000}}
      hard-timeout-ms: ${LLM_TIMEOUT_HARD_MS:${CHAT_LLM_HARD_TIMEOUT_MS:60000}}
      streaming-enabled: ${LLM_STREAMING_ENABLED:true}
      max-concurrency: ${CHAT_LLM_MAX_CONCURRENCY:8}
      max-queue-wait-ms: ${CHAT_LLM_MAX_QUEUE_WAIT_MS:1200}
      budget:
        enabled: ${CHAT_LLM_BUDGET_ENABLED:true}
        sample-window-size: ${CHAT_LLM_BUDGET_SAMPLE_WINDOW_SIZE:240}
        p99-protect-ms: ${CHAT_LLM_BUDGET_P99_PROTECT_MS:4200}
        p99-severe-ms: ${CHAT_LLM_BUDGET_P99_SEVERE_MS:5200}
        p99-recover-ms: ${CHAT_LLM_BUDGET_P99_RECOVER_MS:2600}
        reject-rate-threshold: ${CHAT_LLM_BUDGET_REJECT_RATE_THRESHOLD:0.08}
        reject-rate-severe: ${CHAT_LLM_BUDGET_REJECT_RATE_SEVERE:0.16}
        timeout-rate-threshold: ${CHAT_LLM_BUDGET_TIMEOUT_RATE_THRESHOLD:0.03}
        degrade-allow-percent: ${CHAT_LLM_BUDGET_DEGRADE_ALLOW_PERCENT:45}
        severe-allow-percent: ${CHAT_LLM_BUDGET_SEVERE_ALLOW_PERCENT:20}
    embed:
      base-url: ${CHAT_EMBED_BASE_URL:http://127.0.0.1:23434}
      active-model: ${CHAT_EMBED_ACTIVE_MODEL:bge-m3}
      timeout-ms: ${CHAT_EMBED_TIMEOUT_MS:4000}
    vector-cache-ttl-seconds: ${CHAT_VECTOR_CACHE_TTL_SECONDS:86400}
    debug:
      expose-model-version: ${CHAT_DEBUG_EXPOSE_MODEL_VERSION:true}
